name: Build and test

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v5

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - run: sudo apt-get install -y pandoc texlive-latex-base texlive-latex-extra texlive-pictures

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest

      - name: Copy binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp -L _build/install/default/bin/camelog camelog-linux-x86_64

      - name: Upload binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: camelog-linux-x86_64
          path: camelog-linux-x86_64

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: camelog-linux-x86_64

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest camelog-linux-x86_64 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "camelog (latest build)" \
            --notes "Built from $GITHUB_SHA. Needs libonig5; pandoc for math; latex and dvisvgm for TikZ."
